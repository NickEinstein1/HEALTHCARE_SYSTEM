# UniHealth Phase 1 — staging stack (gateway + consumer + OIDC + data plane)
# Usage:
#   cp infra/.env.staging.example infra/.env.staging
#   docker compose -f infra/docker-compose.staging.yml --env-file infra/.env.staging up -d --build
#   ./scripts/smoke_staging.sh

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 8

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 8

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehr_staging_password}
      POSTGRES_DB: ehr
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr -d ehr"]
      interval: 5s
      timeout: 5s
      retries: 8

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in ehr.patient ehr.encounter ehr.observation ehr.medication_request ehr.allergy_intolerance ehr.analytics.aggregate; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 4 --replication-factor 1
        done
        echo "Kafka topics ready"
    restart: "no"

  consumer:
    build:
      context: ../edge-pipeline
      dockerfile: Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EHR_POSTGRES_DSN: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_staging_password}@postgres:5432/ehr
      EHR_REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  gateway:
    build:
      context: ../ehr-api
      dockerfile: Dockerfile
    ports:
      - "8100:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      EHR_POSTGRES_DSN: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_staging_password}@postgres:5432/ehr
      EHR_REDIS_URL: redis://redis:6379/0
      EHR_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EHR_CONSENT_MODE: permissive
      EHR_OIDC_ENABLED: "true"
      EHR_OIDC_ISSUER_URL: http://localhost:8180/realms/unihealth
      EHR_OIDC_JWKS_URL: http://keycloak:8080/realms/unihealth/protocol/openid-connect/certs
      EHR_OIDC_AUDIENCE: account
      EHR_OIDC_ALLOW_HEADER_FALLBACK: "true"
      EHR_AI_RISK_SCORE_ENABLED: "true"
      EHR_AI_RISK_SCORE_MODEL: "rules"
      # Optional ML assist: set to blend|ml and mount joblib to /app/ml-models/deterioration_v1.joblib
      # EHR_AI_ML_MODEL_PATH: /app/ml-models/deterioration_v1.joblib
      KMHFL_BASE_URL: https://api.kmhfr.health.go.ke
      KMHFL_USE_DEMO_FALLBACK: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  staging_postgres:
