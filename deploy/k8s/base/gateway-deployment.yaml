apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-gateway
  namespace: unihealth
  labels:
    app: ehr-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ehr-gateway
  template:
    metadata:
      labels:
        app: ehr-gateway
    spec:
      containers:
        - name: gateway
          image: unihealth/ehr-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ehr-gateway
  namespace: unihealth
spec:
  selector:
    app: ehr-gateway
  ports:
    - port: 80
      targetPort: 8000
      name: http
