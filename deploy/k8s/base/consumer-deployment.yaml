apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-consumer
  namespace: unihealth
  labels:
    app: ehr-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ehr-consumer
  template:
    metadata:
      labels:
        app: ehr-consumer
    spec:
      containers:
        - name: consumer
          image: unihealth/ehr-consumer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: EHR_REDIS_URL
              value: redis://redis:6379/0
          envFrom:
            - secretRef:
                name: consumer-secrets
                optional: true
