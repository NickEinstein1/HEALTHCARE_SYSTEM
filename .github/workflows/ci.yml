name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r ehr-api/requirements.txt
          pip install -r edge-pipeline/requirements.txt
          pip install -r scripts/requirements.txt

      - name: Lint (Ruff critical rules)
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Markdown lint (project rules; see docs/markdown-style.md)
        run: |
          npx --yes markdownlint-cli2 "README.md" "docs/**/*.md"

      - name: Unit tests (repo root + edge/scripts)
        run: |
          pytest -q tests

      - name: EHR API tests (Phase 1 FHIR contracts + Phase 3 pilot; no Postgres required)
        run: |
          cd ehr-api && PYTHONPATH=. pytest tests/ -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Frontend typecheck & build
        run: |
          cd frontend/app && npm ci && npm run lint && npm run build
