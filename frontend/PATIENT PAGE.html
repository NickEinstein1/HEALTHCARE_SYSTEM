<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Portal — UniHealth 360</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root{--g:#1a8a4a;--gd:#0a4a26;--neon:#2ecc71;--r:#ef4444;--b:#3b82f6;--am:#f59e0b;--pu:#8b5cf6;--pk:#ec4899;--tl:#14b8a6;--bg:#030a05;--gl:rgba(255,255,255,.04);--gl2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.08);--bn:rgba(46,204,113,.22);--t1:#f0fdf4;--t2:rgba(240,253,244,.72);--t3:rgba(240,253,244,.42);--t4:rgba(240,253,244,.2);--fn:'Sora',sans-serif;--fm:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--fn);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(46,204,113,.18);border-radius:2px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:210px;flex-shrink:0;background:rgba(3,8,5,.98);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:20;animation:sb-in .5s ease both}
@keyframes sb-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.sb-brand{display:flex;align-items:center;gap:9px;padding:14px 12px 9px;border-bottom:1px solid var(--bd)}
.sb-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,rgba(46,204,113,.18),rgba(26,138,74,.1));border:1px solid var(--bn);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:lg 4s ease infinite}
@keyframes lg{0%,100%{box-shadow:0 0 10px rgba(46,204,113,.14)}50%{box-shadow:0 0 20px rgba(46,204,113,.3)}}
.sb-nm{font-size:12px;font-weight:700;color:var(--t1);line-height:1}
.sb-tag{font-size:7px;color:var(--t4);letter-spacing:1.2px;text-transform:uppercase;font-family:var(--fm);margin-top:2px}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--gl);border-bottom:1px solid var(--bd)}
.sbu-av{width:29px;height:29px;border-radius:7px;background:rgba(46,204,113,.14);border:1px solid var(--bn);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--neon);flex-shrink:0}
.sbu-nm{font-size:11px;font-weight:600;color:var(--t1)}.sbu-rl{font-size:7.5px;color:var(--t4);font-family:var(--fm)}
.sb-nav{flex:1;overflow-y:auto;padding:5px 0;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-sect{font-family:var(--fm);font-size:6.5px;letter-spacing:2px;text-transform:uppercase;color:var(--t4);padding:8px 12px 3px}
.sb-lnk{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--t3);text-decoration:none;border-left:2px solid transparent;transition:all .2s}
.sb-lnk:hover{background:var(--gl);color:var(--t1);border-left-color:rgba(46,204,113,.4)}
.sb-lnk.active{background:rgba(46,204,113,.08);color:var(--neon);border-left-color:var(--neon)}
.sb-lnk i{width:12px;height:12px;flex-shrink:0}
.sb-ft{padding:8px 12px;border-top:1px solid var(--bd)}
.sb-back{width:100%;padding:7px 10px;background:var(--gl);border:1px solid var(--bd);border-radius:7px;color:var(--t3);font-size:11px;font-family:var(--fn);cursor:pointer;display:flex;align-items:center;gap:5px;justify-content:center;text-decoration:none;transition:all .2s}
.sb-back:hover{background:var(--gl2);border-color:var(--bn);color:var(--neon)}
.sb-ver{font-family:var(--fm);font-size:7px;color:var(--t4);text-align:center;margin-top:5px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:54px;flex-shrink:0;background:rgba(3,8,5,.96);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 16px;animation:tb-in .5s ease .08s both}
@keyframes tb-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.tb-page{font-size:14px;font-weight:700;color:var(--t1);flex:1;display:flex;align-items:center;gap:7px}
.tb-badge{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-family:var(--fm);font-size:7.5px;font-weight:700}
.b-g{background:rgba(46,204,113,.1);border:1px solid var(--bn);color:var(--neon)}
.b-r{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.2);color:#ef4444}
.b-a{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.2);color:#f59e0b}
.b-b{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.2);color:#60a5fa}
.b-pk{background:rgba(236,72,153,.09);border:1px solid rgba(236,72,153,.2);color:#ec4899}
.pdot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pd 2s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.4;transform:scale(1.3)}}
.tb-btn{height:30px;padding:0 12px;border-radius:7px;font-family:var(--fn);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;border:1px solid;transition:all .2s}
.tb-p{background:linear-gradient(135deg,rgba(26,138,74,.88),rgba(46,204,113,.82));border-color:rgba(46,204,113,.3);color:#fff}
.tb-p:hover{box-shadow:0 3px 14px rgba(46,204,113,.28);transform:translateY(-1px)}
.tb-g{background:var(--gl);border-color:var(--bd);color:var(--t2)}
.tb-g:hover{background:var(--gl2);border-color:var(--bn);color:var(--t1)}
.tb-ic{width:30px;height:30px;border-radius:7px;border:1px solid var(--bd);background:var(--gl);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);position:relative;transition:all .2s}
.tb-ic:hover{background:var(--gl2);border-color:var(--bn);color:var(--neon)}
.nn{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--r);font-size:7px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid var(--bg)}
.clk{font-family:var(--fm);font-size:9px;color:var(--t4)}
.content{flex:1;overflow-y:auto;padding:16px 18px;scrollbar-width:thin;animation:ct-in .6s ease .1s both}
@keyframes ct-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:rgba(5,12,7,.97);border:1px solid var(--bd);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--bn);transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,0,0,.45)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(46,204,113,.25),transparent);opacity:0;transition:opacity .2s}
.card:hover::before{opacity:1}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.card-ttl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:var(--t4);font-family:var(--fm);display:flex;align-items:center;gap:5px}
.stat{background:rgba(5,12,7,.97);border:1px solid var(--bd);border-radius:11px;padding:13px 14px;position:relative;overflow:hidden;animation:su .5s ease both;transition:all .22s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--mc,var(--neon));opacity:.5}
.stat:hover{border-color:var(--bn);transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.4)}
/* truncated rest of CSS intentionally to keep file manageable */
</style>    <link rel="stylesheet" href="ai-assist-dashboard.css" />
